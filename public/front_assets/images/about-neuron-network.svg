<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf1f9"/>
      <stop offset="100%" stop-color="#d7e4f4"/>
    </linearGradient>
    <linearGradient id="neuron2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fbcf0"/>
      <stop offset="100%" stop-color="#2f5da8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#bg2)"/>
  <circle cx="180" cy="160" r="220" fill="#ffffff" opacity="0.4"/>

  <!-- neuron network -->
  <g stroke="#2f5da8" stroke-width="3" fill="none" opacity="0.55">
    <path d="M450,320 C380,380 330,460 340,560"/>
    <path d="M450,320 C540,360 600,440 590,540"/>
    <path d="M340,560 C420,600 520,600 590,540"/>
    <path d="M340,560 C280,640 280,740 340,810"/>
    <path d="M590,540 C650,620 660,720 610,800"/>
    <path d="M340,810 C420,860 530,860 610,800"/>
    <path d="M450,320 L450,180"/>
    <path d="M610,800 L700,880"/>
  </g>

  <!-- neuron cell bodies -->
  <g>
    <g transform="translate(450 320)">
      <circle r="70" fill="url(#neuron2)"/>
      <circle r="26" fill="#0a2547" opacity="0.35"/>
      <g stroke="#0a2547" stroke-width="5" stroke-linecap="round" opacity="0.5" fill="none">
        <path d="M-50,-45 C-30,-62 -8,-64 8,-52"/>
        <path d="M52,-38 C64,-20 64,2 52,16"/>
        <path d="M-52,30 C-40,48 -18,56 2,50"/>
      </g>
    </g>
    <g transform="translate(340 560)">
      <circle r="46" fill="url(#neuron2)" opacity="0.9"/>
      <circle r="17" fill="#0a2547" opacity="0.35"/>
    </g>
    <g transform="translate(590 540)">
      <circle r="46" fill="url(#neuron2)" opacity="0.9"/>
      <circle r="17" fill="#0a2547" opacity="0.35"/>
    </g>
    <g transform="translate(340 810)">
      <circle r="40" fill="url(#neuron2)" opacity="0.85"/>
      <circle r="15" fill="#0a2547" opacity="0.35"/>
    </g>
    <g transform="translate(610 800)">
      <circle r="40" fill="url(#neuron2)" opacity="0.85"/>
      <circle r="15" fill="#0a2547" opacity="0.35"/>
    </g>
  </g>

  <!-- synaptic sparks -->
  <g fill="#d9a531">
    <circle cx="392" cy="446" r="8"/>
    <circle cx="498" cy="442" r="8"/>
    <circle cx="330" cy="692" r="7"/>
    <circle cx="604" cy="676" r="7"/>
    <circle cx="474" cy="836" r="7"/>
  </g>
  <g fill="#f2d488">
    <circle cx="392" cy="446" r="4"/>
    <circle cx="498" cy="442" r="4"/>
    <circle cx="330" cy="692" r="3.5"/>
    <circle cx="604" cy="676" r="3.5"/>
    <circle cx="474" cy="836" r="3.5"/>
  </g>
</svg>
