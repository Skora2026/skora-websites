<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGlow" cx="72%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0f3a6e"/>
      <stop offset="45%" stop-color="#081a30"/>
      <stop offset="100%" stop-color="#050f1d"/>
    </radialGradient>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fbcf0"/>
      <stop offset="55%" stop-color="#3a72b8"/>
      <stop offset="100%" stop-color="#1b3a66"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a531"/>
      <stop offset="100%" stop-color="#8a6516"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b7d4f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b7d4f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#8fbcf0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGlow)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <ellipse cx="1210" cy="260" rx="560" ry="420" fill="#143d70" opacity="0.28"/>

  <!-- ── Brain (right side) ── -->
  <g transform="translate(1150 330)" opacity="0.92">
    <ellipse cx="0" cy="0" rx="270" ry="220" fill="url(#nodeGlow)" opacity="0.35"/>
    <!-- cerebrum outline -->
    <path d="M-190,60 C-235,20 -225,-70 -160,-115 C-120,-145 -60,-160 0,-155
             C80,-162 170,-120 195,-40 C215,20 195,90 140,125
             C95,155 20,165 -45,150 C-110,138 -160,110 -190,60 Z"
          fill="url(#brainGrad)" opacity="0.88"/>
    <!-- central sulcus -->
    <path d="M-30,-150 C-45,-90 -40,-20 -60,60 C-70,100 -85,130 -100,148"
          fill="none" stroke="#0a2547" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
    <!-- gyri folds -->
    <g fill="none" stroke="#0a2547" stroke-width="6" stroke-linecap="round" opacity="0.5">
      <path d="M-150,-70 C-120,-95 -85,-90 -70,-60 C-55,-30 -70,-5 -95,5"/>
      <path d="M-160,40 C-130,25 -105,40 -100,70 C-95,95 -110,115 -130,118"/>
      <path d="M10,-140 C40,-120 45,-85 25,-60 C5,-38 -25,-42 -40,-25"/>
      <path d="M70,-120 C110,-110 130,-75 115,-40 C105,-15 75,-8 55,-20"/>
      <path d="M130,-10 C160,5 165,45 140,70 C120,90 90,85 80,65"/>
      <path d="M-20,80 C10,70 40,85 45,115 C48,138 30,155 5,155"/>
      <path d="M100,95 C125,100 140,120 130,140"/>
    </g>
    <!-- stem / cerebellum hint -->
    <path d="M-60,150 C-55,175 -40,190 -20,196" fill="none" stroke="#0a2547" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <!-- neural sparks -->
    <g fill="#cfe4fb">
      <circle cx="-120" cy="-55" r="5"/>
      <circle cx="30" cy="-95" r="4"/>
      <circle cx="120" cy="-20" r="5"/>
      <circle cx="60" cy="60" r="4"/>
      <circle cx="-90" cy="70" r="4"/>
    </g>
    <g stroke="#b7d4f7" stroke-width="1.6" opacity="0.5" fill="none">
      <path d="M-120,-55 L30,-95 L120,-20 L60,60 L-90,70 Z"/>
      <path d="M30,-95 L60,60"/>
    </g>
  </g>

  <!-- ── Spine (lower right, curving from brain) ── -->
  <g transform="translate(1155 300)" opacity="0.95">
    <path d="M-20,196 C-10,300 20,420 -5,560 C-25,670 -15,760 10,860"
          fill="none" stroke="url(#spineGrad)" stroke-width="17" stroke-linecap="round"/>
    <!-- vertebrae -->
    <g fill="#f0d48a" stroke="#5c430f" stroke-width="2">
      <g transform="rotate(-4 -12 260)"><rect x="-38" y="248" width="76" height="24" rx="9"/></g>
      <g transform="rotate(-2 -6 320)"><rect x="-36" y="308" width="72" height="24" rx="9"/></g>
      <g transform="rotate(0 0 380)"><rect x="-34" y="368" width="68" height="24" rx="9"/></g>
      <g transform="rotate(2 6 440)"><rect x="-32" y="428" width="64" height="24" rx="9"/></g>
      <g transform="rotate(3 10 500)"><rect x="-30" y="488" width="60" height="24" rx="9"/></g>
      <g transform="rotate(2 8 560)"><rect x="-28" y="548" width="56" height="24" rx="9"/></g>
      <g transform="rotate(0 4 620)"><rect x="-26" y="608" width="52" height="24" rx="9"/></g>
      <g transform="rotate(-2 0 680)"><rect x="-24" y="668" width="48" height="24" rx="9"/></g>
      <g transform="rotate(-4 -4 740)"><rect x="-22" y="728" width="44" height="24" rx="9"/></g>
      <g transform="rotate(-6 -8 800)"><rect x="-20" y="788" width="40" height="24" rx="9"/></g>
    </g>
    <!-- spinal nerve roots -->
    <g stroke="#d9a531" stroke-width="3" fill="none" opacity="0.65" stroke-linecap="round">
      <path d="M-40,262 C-70,268 -90,285 -105,310"/>
      <path d="M40,268 C70,276 88,294 100,320"/>
      <path d="M-36,382 C-66,390 -84,408 -96,432"/>
      <path d="M36,388 C64,396 82,414 92,438"/>
      <path d="M-30,502 C-58,510 -74,526 -84,548"/>
      <path d="M30,508 C56,516 72,532 80,552"/>
      <path d="M-26,622 C-50,630 -64,644 -72,662"/>
      <path d="M26,626 C48,634 62,648 68,666"/>
    </g>
  </g>

  <!-- faint pulse line across the bottom -->
  <path d="M0,905 L520,905 L580,860 L650,940 L720,905 L1600,905"
        fill="none" stroke="#8fbcf0" stroke-opacity="0.22" stroke-width="2"/>
</svg>
