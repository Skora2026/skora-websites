      <stop offset="0%" stop-color="#0f3a6e"/>
      <stop offset="58%" stop-color="#081a30"/>
      <stop offset="100%" stop-color="#050f1d"/>
    </radialGradient>
    <linearGradient id="phbrain" x1="0" y1="0" x2="1" y2="1">
