    </pattern>
  </defs>
  <rect width="1600" height="520" fill="url(#phbg)"/>
  <rect width="1600" height="520" fill="url(#phgrid)"/>
  <ellipse cx="800" cy="130" rx="720" ry="230" fill="#143d70" opacity="0.28"/>

